# The phone Capture page (module phone-drop): the folder phone/ published on GitHub Pages, at
# https://daniel-piatek.github.io/sovran-advisor-app/. Runs when phone/ changes on main, or by hand.
# Once only, in the repository's Settings › Pages: Source = GitHub Actions.
name: Phone page
on:
  push:
    branches: [main]
    paths: ['phone/**', '.github/workflows/phone-page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A phone keeps the page's files for ten minutes and a reload only asks again for index.html, so every file
      # index.html and the scripts load is named with this version: a reload then shows a new version at once.
      - name: Name the files with this version
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s/(href=\"phone\.css|src=\"phone\.js)\"/\1?v=$v\"/" phone/index.html
          sed -i -E "s#from '\./([a-z-]+)\.js'#from './\1.js?v=$v'#" phone/phone.js phone/reports.js phone/quest-new.js
          grep -c "?v=$v" phone/index.html phone/phone.js phone/reports.js phone/quest-new.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone
      # GitHub sometimes does not list the upload yet when the next step asks for it ("No artifacts named
      # github-pages", three times on 22 Nov 2026). A short wait lets it appear.
      - name: Wait for the upload to be listed
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
