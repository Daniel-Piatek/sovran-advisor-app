# The phone Capture page (module phone-drop): the folder phone/ published on GitHub Pages, at
# https://daniel-piatek.github.io/sovran-advisor-app/. Runs when phone/ changes on main, or by hand.
# Once only, in the repository's Settings › Pages: Source = GitHub Actions.
name: Phone page
on:
  push:
    branches: [main]
    paths: ['phone/**', '.github/workflows/phone-page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone
      - id: deployment
        uses: actions/deploy-pages@v4
