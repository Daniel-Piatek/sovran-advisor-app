const bar = $('gf-bar'), pp = $('gf-pp');
const chips = scenes.map((s, i) => { const SHORT = {"This Is go Sovran": "go Sovran", "Ask My Sovran Advisor": "Ask My Advisor", "Three Ways to Write": "Three Ways", "From Me and From Other": "From Me / Other", "Ask About Words in a Report": "Ask About Words"}; const b = h('button', 'gf-scene', SHORT[s.t] || s.t); b.title = s.t; b.type = 'button'; b.addEventListener('click', () => go(i)); $('gf-scenes').append(b); return b; });
function show(i) {
  now = i; $('gf-n').textContent = `Chapter ${i + 1} of ${scenes.length}`; $('gf-h').textContent = scenes[i].t; $('gf-p').textContent = scenes[i].c;
  chips.forEach((c, j) => c.setAttribute('aria-current', String(i === j)));
  bar.style.width = (i / scenes.length * 100) + '%';
}
function setPaused(v) { paused = v; pp.textContent = v ? '▶' : '❚❚'; $('gf-ppl').textContent = v ? 'Play' : 'Pause'; pp.setAttribute('aria-label', v ? 'Play' : 'Pause'); veil.hidden = !v; }
async function loop(start) {
  const t = ++token;
  for (let i = start; ; i = (i + 1) % scenes.length) {
    tip.hidden = true; hideDot(); show(i); audio.pause(); intro = 'scene:' + scenes[i].t;
    try { await scenes[i].run(); await sleep(700, t); } catch (e) { if (e instanceof Stop) return; console.error(e); return; }
    if (t !== token) return;
    bar.style.width = ((i + 1) / scenes.length * 100) + '%';
  }
}
function go(i) { setPaused(false); loop(i); }
pp.addEventListener('click', () => setPaused(!paused));
$('gf-phone').addEventListener('click', () => setPaused(!paused));
$('gf-again').addEventListener('click', () => go(0));
let now = 0;
$('gf-prev').addEventListener('click', () => go((now - 1 + scenes.length) % scenes.length));
$('gf-next').addEventListener('click', () => go((now + 1) % scenes.length));
// The first frame is the real first screen, so a still picture already shows go Sovran. It plays once it is on screen.
frame('home'); show(0);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); $('gf-prev').click(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); $('gf-next').click(); }
  if (e.code === 'Space' && !e.target.closest?.('button, a')) { e.preventDefault(); setPaused(!paused); }
});
$('gf-back').addEventListener('click', (e) => {
  if (document.documentElement.classList.contains('embedded')) { e.preventDefault(); parent.postMessage({ film: 'back' }, '*'); return; }
  try { window.parent.document.dispatchEvent(new CustomEvent('app-navigate', { detail: '/tour' })); e.preventDefault(); } catch { /* the link goes there itself */ }
});
const snd = $('gf-snd');
function setSound(v) { sound = v; snd.setAttribute('aria-pressed', String(v)); snd.textContent = v ? '🔇 Mute' : '🔊 Sound on'; snd.setAttribute('aria-label', v ? 'Mute the voice' : 'Turn the voice on'); if (!v) audio.pause(); }
snd.addEventListener('click', () => setSound(!sound));
// Sound starts on where the browser lets it (inside the app it does); otherwise Sound on is one click.
audio.src = VO.silent; audio.play().then(() => setSound(true)).catch(() => {});
setTimeout(() => go(0), 800);
})();
</script>
